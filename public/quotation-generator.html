<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <!-- Primary Meta Tags -->
    <title>Quotation Generator | Pintorex Construction Limited - Professional Construction Estimates</title>
    <meta name="title" content="Quotation Generator | Pintorex Construction Limited - Professional Construction Estimates">
    <meta name="description" content="Generate professional quotations, invoices, contracts, and delivery notes for construction projects. Pintorex Construction Limited's internal document generation tool.">
    <meta name="keywords" content="construction quotation, construction invoice, building estimate, construction contract, Pintorex Construction, Kenya construction quotes, professional quotation generator">
    <meta name="author" content="Pintorex Construction Limited">
    <meta name="robots" content="noindex, nofollow">

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="images/logo_pint.png">
    <link rel="icon" type="image/png" sizes="16x16" href="images/logo_pint.png">
    <link rel="apple-touch-icon" sizes="180x180" href="images/logo_pint.png">
    <link rel="shortcut icon" href="images/logo_pint.png">

    <!-- Theme Color -->
    <meta name="theme-color" content="#F97316">

    <!-- Stylesheets -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">

    <style>
        /* Construction-style fonts */
        .font-construction {
            font-family: 'Oswald', sans-serif;
        }
        body {
            font-family: 'Roboto', sans-serif;
        }
        h1, h2, h3 {
            font-family: 'Oswald', sans-serif;
        }

        /* Focus styles for accessibility */
        a:focus, button:focus, input:focus, select:focus, textarea:focus {
            outline: 2px solid #F97316;
            outline-offset: 2px;
        }

        /* Toast notification styles */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 16px 24px;
            border-radius: 8px;
            color: white;
            font-weight: 500;
            z-index: 9999;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s ease;
        }
        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
        .toast.success { background: #10B981; }
        .toast.error { background: #EF4444; }
        .toast.info { background: #F97316; }

        /* Loading spinner */
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #F97316;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 8px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Skip link */
        .skip-link {
            position: absolute;
            top: -40px;
            left: 0;
            background: #F97316;
            color: white;
            padding: 8px 16px;
            z-index: 100;
            transition: top 0.3s;
        }
        .skip-link:focus {
            top: 0;
        }

        /* Construction accent colors */
        .text-construction-orange { color: #F97316; }
        .bg-construction-orange { background-color: #F97316; }
        .hover-construction-orange:hover { background-color: #EA580C; }
        .focus-construction-orange:focus { ring-color: #F97316; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- Skip to content link -->
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <!-- Header with Logo -->
    <header class="bg-white shadow-sm">
        <div class="container mx-auto px-4 py-3">
            <div class="flex items-center justify-between">
                <a href="index.html" class="flex items-center space-x-3 hover:opacity-90 transition duration-300">
                    <img src="images/logo_pint.png" alt="Pintorex Construction Logo" class="h-10 w-auto">
                    <span class="text-xl md:text-2xl font-bold font-construction text-gray-800 tracking-wide">PINTOREX</span>
                </a>
                <nav aria-label="Breadcrumb">
                    <ol class="flex items-center space-x-2 text-sm">
                        <li>
                            <a href="index.html" class="text-construction-orange hover:text-orange-600 transition">Home</a>
                        </li>
                        <li class="text-gray-400">/</li>
                        <li class="text-gray-600 font-medium" aria-current="page">Quotation Generator</li>
                    </ol>
                </nav>
            </div>
        </div>
    </header>

    <div id="main-content" class="container mx-auto px-4 py-8">
        <h1 class="text-3xl md:text-4xl font-bold text-center mb-8 text-gray-800 font-construction tracking-wide">QUOTATION GENERATOR</h1>

        <!-- Login Section -->
        <div id="loginSection" class="max-w-md mx-auto bg-white p-8 rounded-lg shadow-md">
            <div class="text-center mb-6">
                <img src="images/logo_pint.png" alt="Pintorex Construction" class="h-16 w-auto mx-auto mb-4">
                <p class="text-gray-600">Enter your credentials to access the quotation generator</p>
            </div>
            <form id="loginForm" class="space-y-4">
                <div class="mb-4">
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-2">Password:</label>
                    <input type="password" id="password" name="password" required
                           class="w-full px-4 py-3 rounded-lg border border-gray-300 bg-white text-gray-900 focus:ring-2 focus:ring-orange-500 focus:border-transparent transition"
                           autocomplete="off">
                    <p id="loginError" class="text-red-500 text-sm mt-2 hidden"></p>
                </div>
                <button type="submit" id="loginBtn" class="w-full bg-construction-orange hover-construction-orange text-white font-bold py-3 px-4 rounded-lg transition duration-300">
                    <span id="loginText">Login</span>
                    <span id="loginSpinner" class="hidden"><span class="spinner"></span>Verifying...</span>
                </button>
            </form>
        </div>

        <!-- Quotation Section (Hidden until login) -->
        <div id="quotationSection" class="hidden max-w-4xl mx-auto bg-white p-8 rounded-lg shadow-md">
            <form id="quotationForm" class="space-y-6">
                <!-- Client Info -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="clientName" class="block text-sm font-medium text-gray-700 mb-2">Client Name:</label>
                        <input type="text" id="clientName" name="clientName" required maxlength="100"
                               class="w-full px-4 py-3 rounded-lg border border-gray-300 bg-white text-gray-900 focus:ring-2 focus:ring-orange-500 transition">
                    </div>
                    <div>
                        <label for="projectType" class="block text-sm font-medium text-gray-700 mb-2">Project Type:</label>
                        <select id="projectType" name="projectType" required
                                class="w-full px-4 py-3 rounded-lg border border-gray-300 bg-white text-gray-900 focus:ring-2 focus:ring-orange-500 transition">
                            <option value="New Construction - Residential">New Construction - Residential</option>
                            <option value="New Construction - Commercial">New Construction - Commercial</option>
                            <option value="Renovation - Residential">Renovation - Residential</option>
                            <option value="Renovation - Commercial">Renovation - Commercial</option>
                            <option value="Interior Fit-Out">Interior Fit-Out</option>
                            <option value="Exterior Remodeling">Exterior Remodeling</option>
                            <option value="Home Addition">Home Addition</option>
                            <option value="Infrastructure Construction">Infrastructure Construction</option>
                            <option value="Industrial Construction">Industrial Construction</option>
                            <option value="Landscaping">Landscaping</option>
                            <option value="Demolition">Demolition</option>
                            <option value="Material Supply Only">Material Supply Only</option>
                            <option value="Equipment Rental">Equipment Rental</option>
                            <option value="Concrete Work">Concrete Work</option>
                            <option value="Roofing">Roofing</option>
                            <option value="Electrical Installation">Electrical Installation</option>
                            <option value="Plumbing Installation">Plumbing Installation</option>
                            <option value="HVAC Installation">HVAC Installation</option>
                            <option value="Painting">Painting</option>
                            <option value="Flooring Installation">Flooring Installation</option>
                            <option value="Custom Carpentry">Custom Carpentry</option>
                            <option value="Site Preparation">Site Preparation</option>
                            <option value="Other">Other (Please specify in description)</option>
                        </select>
                    </div>
                </div>

                <!-- Project Description -->
                <div>
                    <label for="projectDescription" class="block text-sm font-medium text-gray-700 mb-2">Project Description:</label>
                    <textarea id="projectDescription" name="projectDescription" rows="3" maxlength="1000"
                              class="w-full px-4 py-3 rounded-lg border border-gray-300 bg-white text-gray-900 focus:ring-2 focus:ring-orange-500 transition"></textarea>
                </div>

                <!-- Materials Section -->
                <div class="space-y-4">
                    <h3 class="font-bold text-lg text-gray-800 font-construction">MATERIALS:</h3>
                    <div id="materialsContainer" class="space-y-2"></div>
                    <button type="button" id="addMaterialBtn" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-lg transition duration-300">
                        + Add Material
                    </button>
                </div>

                <!-- Labor & Costs -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="laborType" class="block text-sm font-medium text-gray-700 mb-2">Labor Cost Type:</label>
                        <select id="laborType" name="laborType"
                                class="w-full px-4 py-3 rounded-lg border border-gray-300 bg-white text-gray-900 focus:ring-2 focus:ring-orange-500 transition">
                            <option value="custom">Custom Amount</option>
                            <option value="30">30% of Materials</option>
                            <option value="28">28% of Materials</option>
                            <option value="25">25% of Materials</option>
                            <option value="20">20% of Materials</option>
                            <option value="15">15% of Materials</option>
                        </select>
                    </div>
                    <div id="customLaborDiv">
                        <label for="laborCost" class="block text-sm font-medium text-gray-700 mb-2">Labor Cost (KES):</label>
                        <input type="number" id="laborCost" name="laborCost" min="0" step="0.01"
                               class="w-full px-4 py-3 rounded-lg border border-gray-300 bg-white text-gray-900 focus:ring-2 focus:ring-orange-500 transition">
                    </div>
                    <div>
                        <label for="vatPercentage" class="block text-sm font-medium text-gray-700 mb-2">VAT Percentage:</label>
                        <select id="vatPercentage" name="vatPercentage" required
                                class="w-full px-4 py-3 rounded-lg border border-gray-300 bg-white text-gray-900 focus:ring-2 focus:ring-orange-500 transition">
                            <option value="0">No VAT (0%)</option>
                            <option value="16">16% (Standard Rate)</option>
                            <option value="8">8% (Reduced Rate)</option>
                        </select>
                    </div>
                    <div>
                        <label for="contingencyPercentage" class="block text-sm font-medium text-gray-700 mb-2">Contingency Percentage:</label>
                        <select id="contingencyPercentage" name="contingencyPercentage" required
                                class="w-full px-4 py-3 rounded-lg border border-gray-300 bg-white text-gray-900 focus:ring-2 focus:ring-orange-500 transition">
                            <option value="0">No Contingency (0%)</option>
                            <option value="5">5%</option>
                            <option value="10">10%</option>
                            <option value="15">15%</option>
                            <option value="20">20%</option>
                        </select>
                    </div>
                </div>

                <!-- Main Submit Button -->
                <div class="flex justify-center">
                    <button type="submit" class="bg-construction-orange hover-construction-orange text-white font-bold py-3 px-8 rounded-lg transition duration-300 text-lg shadow-lg">
                        Generate Quotation PDF
                    </button>
                </div>

                <!-- Additional Documents Section -->
                <div class="mt-8 border-t pt-8">
                    <h3 class="text-lg font-bold text-gray-800 mb-4 font-construction">ADDITIONAL DOCUMENTS</h3>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <button type="button" id="generateAcceptance" class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg transition duration-300 text-sm">
                            Acceptance Letter
                        </button>
                        <button type="button" id="generatePayment" class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg transition duration-300 text-sm">
                            Payment Request
                        </button>
                        <button type="button" id="generateInvoice" class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg transition duration-300 text-sm">
                            Invoice
                        </button>
                        <button type="button" id="generateDelivery" class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg transition duration-300 text-sm">
                            Delivery Note
                        </button>
                        <button type="button" id="generateContract" class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg transition duration-300 text-sm">
                            Contract Agreement
                        </button>
                        <button type="button" id="generateRecommendation" class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg transition duration-300 text-sm">
                            Recommendation
                        </button>
                        <button type="button" id="generateReceipt" class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg transition duration-300 text-sm">
                            Receipt
                        </button>
                        <button type="button" id="generateLPO" class="bg-gray-600 hover:bg-gray-700 text-white font-bold py-3 px-4 rounded-lg transition duration-300 text-sm">
                            LPO
                        </button>
                    </div>
                    <div class="mt-4 text-center">
                        <button type="button" id="generateAll" class="bg-construction-orange hover-construction-orange text-white font-bold py-3 px-6 rounded-lg transition duration-300 shadow-lg">
                            Generate All Documents
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white py-4 mt-8">
        <div class="container mx-auto px-4 text-center">
            <p class="text-gray-400 text-sm">&copy; 2024 Pintorex Construction Limited. Internal Use Only.</p>
        </div>
    </footer>

    <!-- Toast notification -->
    <div id="toast" class="toast" role="alert" aria-live="polite"></div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <script src="script/quotation-generator-script.js"></script>
</body>
</html>
