<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pintorex Quotation Generator</title>
    <meta name="description" content="Generate professional quotations, invoices, and contracts for construction projects.">
    <link rel="icon" type="image/png" href="images/favicon_io/favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
    <style>
        /* Focus styles for accessibility */
        a:focus, button:focus, input:focus, select:focus, textarea:focus {
            outline: 2px solid #3B82F6;
            outline-offset: 2px;
        }

        /* Toast notification styles */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 16px 24px;
            border-radius: 8px;
            color: white;
            font-weight: 500;
            z-index: 9999;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s ease;
        }
        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
        .toast.success { background: #10B981; }
        .toast.error { background: #EF4444; }
        .toast.info { background: #3B82F6; }

        /* Loading spinner */
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3B82F6;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 8px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Skip link */
        .skip-link {
            position: absolute;
            top: -40px;
            left: 0;
            background: #3B82F6;
            color: white;
            padding: 8px 16px;
            z-index: 100;
            transition: top 0.3s;
        }
        .skip-link:focus {
            top: 0;
        }

        /* Button color standardization */
        .btn-primary { @apply bg-blue-500 hover:bg-blue-600 text-white; }
        .btn-success { @apply bg-green-600 hover:bg-green-700 text-white; }
        .btn-secondary { @apply bg-gray-500 hover:bg-gray-600 text-white; }
        .btn-danger { @apply bg-red-500 hover:bg-red-600 text-white; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- Skip to content link -->
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <!-- Breadcrumb Navigation -->
    <nav class="bg-white shadow-sm" aria-label="Breadcrumb">
        <div class="container mx-auto px-4 py-3">
            <ol class="flex items-center space-x-2 text-sm">
                <li>
                    <a href="index.html" class="text-blue-600 hover:text-blue-800">Home</a>
                </li>
                <li class="text-gray-500">/</li>
                <li class="text-gray-600" aria-current="page">Quotation Generator</li>
            </ol>
        </div>
    </nav>

    <div id="main-content" class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold text-center mb-8 text-gray-700">Pintorex Quotation Generator</h1>

        <!-- Login Section -->
        <div id="loginSection" class="max-w-md mx-auto bg-white p-8 rounded-lg shadow-md">
            <form id="loginForm" class="space-y-4">
                <div class="mb-4">
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-2">Enter Password:</label>
                    <input type="password" id="password" name="password" required
                           class="w-full px-4 py-3 rounded-lg border border-gray-300 bg-white text-gray-900 focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                           autocomplete="off">
                    <p id="loginError" class="text-red-500 text-sm mt-2 hidden"></p>
                </div>
                <button type="submit" id="loginBtn" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-4 rounded-lg transition duration-300">
                    <span id="loginText">Login</span>
                    <span id="loginSpinner" class="hidden"><span class="spinner"></span>Verifying...</span>
                </button>
            </form>
        </div>

        <!-- Quotation Section (Hidden until login) -->
        <div id="quotationSection" class="hidden max-w-4xl mx-auto bg-white p-8 rounded-lg shadow-md">
            <form id="quotationForm" class="space-y-6">
                <!-- Client Info -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="clientName" class="block text-sm font-medium text-gray-700 mb-2">Client Name:</label>
                        <input type="text" id="clientName" name="clientName" required maxlength="100"
                               class="w-full px-4 py-3 rounded-lg border border-gray-300 bg-white text-gray-900 focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label for="projectType" class="block text-sm font-medium text-gray-700 mb-2">Project Type:</label>
                        <select id="projectType" name="projectType" required
                                class="w-full px-4 py-3 rounded-lg border border-gray-300 bg-white text-gray-900 focus:ring-2 focus:ring-blue-500">
                            <option value="New Construction - Residential">New Construction - Residential</option>
                            <option value="New Construction - Commercial">New Construction - Commercial</option>
                            <option value="Renovation - Residential">Renovation - Residential</option>
                            <option value="Renovation - Commercial">Renovation - Commercial</option>
                            <option value="Interior Fit-Out">Interior Fit-Out</option>
                            <option value="Exterior Remodeling">Exterior Remodeling</option>
                            <option value="Home Addition">Home Addition</option>
                            <option value="Infrastructure Construction">Infrastructure Construction</option>
                            <option value="Industrial Construction">Industrial Construction</option>
                            <option value="Landscaping">Landscaping</option>
                            <option value="Demolition">Demolition</option>
                            <option value="Material Supply Only">Material Supply Only</option>
                            <option value="Equipment Rental">Equipment Rental</option>
                            <option value="Concrete Work">Concrete Work</option>
                            <option value="Roofing">Roofing</option>
                            <option value="Electrical Installation">Electrical Installation</option>
                            <option value="Plumbing Installation">Plumbing Installation</option>
                            <option value="HVAC Installation">HVAC Installation</option>
                            <option value="Painting">Painting</option>
                            <option value="Flooring Installation">Flooring Installation</option>
                            <option value="Custom Carpentry">Custom Carpentry</option>
                            <option value="Site Preparation">Site Preparation</option>
                            <option value="Other">Other (Please specify in description)</option>
                        </select>
                    </div>
                </div>

                <!-- Project Description -->
                <div>
                    <label for="projectDescription" class="block text-sm font-medium text-gray-700 mb-2">Project Description:</label>
                    <textarea id="projectDescription" name="projectDescription" rows="3" maxlength="1000"
                              class="w-full px-4 py-3 rounded-lg border border-gray-300 bg-white text-gray-900 focus:ring-2 focus:ring-blue-500"></textarea>
                </div>

                <!-- Materials Section -->
                <div class="space-y-4">
                    <h3 class="font-bold text-lg text-gray-700">Materials:</h3>
                    <div id="materialsContainer" class="space-y-2"></div>
                    <button type="button" id="addMaterialBtn" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-lg transition duration-300">
                        + Add Material
                    </button>
                </div>

                <!-- Labor & Costs -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="laborType" class="block text-sm font-medium text-gray-700 mb-2">Labor Cost Type:</label>
                        <select id="laborType" name="laborType"
                                class="w-full px-4 py-3 rounded-lg border border-gray-300 bg-white text-gray-900 focus:ring-2 focus:ring-blue-500">
                            <option value="custom">Custom Amount</option>
                            <option value="30">30% of Materials</option>
                            <option value="28">28% of Materials</option>
                            <option value="25">25% of Materials</option>
                            <option value="20">20% of Materials</option>
                            <option value="15">15% of Materials</option>
                        </select>
                    </div>
                    <div id="customLaborDiv">
                        <label for="laborCost" class="block text-sm font-medium text-gray-700 mb-2">Labor Cost (KES):</label>
                        <input type="number" id="laborCost" name="laborCost" min="0" step="0.01"
                               class="w-full px-4 py-3 rounded-lg border border-gray-300 bg-white text-gray-900 focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label for="vatPercentage" class="block text-sm font-medium text-gray-700 mb-2">VAT Percentage:</label>
                        <select id="vatPercentage" name="vatPercentage" required
                                class="w-full px-4 py-3 rounded-lg border border-gray-300 bg-white text-gray-900 focus:ring-2 focus:ring-blue-500">
                            <option value="0">No VAT (0%)</option>
                            <option value="16">16% (Standard Rate)</option>
                            <option value="8">8% (Reduced Rate)</option>
                        </select>
                    </div>
                    <div>
                        <label for="contingencyPercentage" class="block text-sm font-medium text-gray-700 mb-2">Contingency Percentage:</label>
                        <select id="contingencyPercentage" name="contingencyPercentage" required
                                class="w-full px-4 py-3 rounded-lg border border-gray-300 bg-white text-gray-900 focus:ring-2 focus:ring-blue-500">
                            <option value="0">No Contingency (0%)</option>
                            <option value="5">5%</option>
                            <option value="10">10%</option>
                            <option value="15">15%</option>
                            <option value="20">20%</option>
                        </select>
                    </div>
                </div>

                <!-- Main Submit Button -->
                <div class="flex justify-center">
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-lg transition duration-300 text-lg">
                        Generate Quotation PDF
                    </button>
                </div>

                <!-- Additional Documents Section -->
                <div class="mt-8 border-t pt-8">
                    <h3 class="text-lg font-bold text-gray-700 mb-4">Additional Documents</h3>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <button type="button" id="generateAcceptance" class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg transition duration-300 text-sm">
                            Acceptance Letter
                        </button>
                        <button type="button" id="generatePayment" class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg transition duration-300 text-sm">
                            Payment Request
                        </button>
                        <button type="button" id="generateInvoice" class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg transition duration-300 text-sm">
                            Invoice
                        </button>
                        <button type="button" id="generateDelivery" class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg transition duration-300 text-sm">
                            Delivery Note
                        </button>
                        <button type="button" id="generateContract" class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg transition duration-300 text-sm">
                            Contract Agreement
                        </button>
                        <button type="button" id="generateRecommendation" class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg transition duration-300 text-sm">
                            Recommendation
                        </button>
                        <button type="button" id="generateReceipt" class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg transition duration-300 text-sm">
                            Receipt
                        </button>
                        <button type="button" id="generateLPO" class="bg-gray-600 hover:bg-gray-700 text-white font-bold py-3 px-4 rounded-lg transition duration-300 text-sm">
                            LPO
                        </button>
                    </div>
                    <div class="mt-4 text-center">
                        <button type="button" id="generateAll" class="bg-blue-700 hover:bg-blue-800 text-white font-bold py-3 px-6 rounded-lg transition duration-300">
                            Generate All Documents
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast notification -->
    <div id="toast" class="toast" role="alert" aria-live="polite"></div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <script src="script/quotation-generator-script.js"></script>
</body>
</html>
